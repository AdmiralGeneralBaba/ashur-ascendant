<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashur Ascendant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --gold: #d9aa3f; --gold2: #f3d584; --ink: #0d1424; --panel: #131c33; --panel2: #1b2747; --line: #2e3f6b; --text: #ece2c8; --muted: #98a2ba; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; display: flex; flex-direction: column; background: var(--ink); color: var(--text); font: 13px/1.4 Georgia, 'Times New Roman', serif; overflow: hidden; }
  .cz { font-family: Cinzel, Georgia, serif; }
  #top { min-height: 48px; flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 20px; padding: 6px 14px; background: linear-gradient(#1f2d52, #152040); border-bottom: 2px solid var(--gold); box-shadow: 0 2px 12px rgba(0,0,0,.5); white-space: nowrap; z-index: 2; }
  #top h1 { font: 700 18px Cinzel, Georgia, serif; margin: 0; color: var(--gold2); letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 1px 0 #000; }
  #top .sp { flex: 1; }
  #top .stat b { color: #fff; font-size: 14px; }
  .btn { display: inline-block; padding: 3px 10px; border: 1px solid var(--gold); border-radius: 3px; background: linear-gradient(#2b3f70, #1f2f57); color: #f4e9cc; cursor: pointer; user-select: none; transition: background .12s, transform .06s; }
  .btn:hover { background: linear-gradient(#3a5290, #2a3e72); }
  .btn:active { transform: translateY(1px); }
  .btn.on { background: linear-gradient(var(--gold2), var(--gold)); color: #1a2240; font-weight: bold; }
  .btn.off { opacity: .35; cursor: default; }
  #main { display: flex; flex: 1; min-height: 0; }
  #side { width: 300px; flex: none; overflow-y: auto; padding: 10px 12px 30px; background: var(--panel); border-right: 1px solid var(--line); }
  #side::-webkit-scrollbar { width: 8px; } #side::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
  #side h3 { margin: 16px 0 6px; font: 700 12px Cinzel, Georgia, serif; letter-spacing: 2px; text-transform: uppercase; color: var(--gold2); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #side h3:first-child { margin-top: 0; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--gold); border-radius: 4px; padding: 8px 10px; margin-bottom: 4px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
  .row + .row { border-top: 1px solid rgba(46,63,107,.5); }
  .muted { color: var(--muted); font-size: 12px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
  .good { color: #8fdc8a; } .bad { color: #f39483; }
  .ic { stroke: #fff; stroke-width: 1.3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  svg.ui { width: 22px; height: 22px; flex: none; background: #0d1424; border: 1px solid var(--line); border-radius: 50%; padding: 3px; margin-right: 8px; vertical-align: middle; }
  .bar { height: 5px; background: #0d1424; border-radius: 3px; overflow: hidden; margin: 4px 0; } .bar i { display: block; height: 100%; background: #7fe07a; }
  #mapwrap { flex: 1; position: relative; min-width: 0; touch-action: none; background: #244463; }
  #mapwrap::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 120px rgba(5,10,22,.75); }
  #map { width: 100%; height: 100%; display: block; cursor: grab; }
  #map polygon.land { stroke: rgba(50,34,14,.55); stroke-width: .9; cursor: pointer; transition: opacity .25s; }
  #map polygon.land:hover { filter: brightness(1.13); }
  #map polygon.foe { stroke: #d21f1f; stroke-width: 1.8; }
  #map polygon.sel { stroke: #fff; stroke-width: 2.4; }
  #map text { font-family: Georgia, serif; pointer-events: none; }
  #map .lbl { font-size: 8px; fill: #1d150a; text-anchor: middle; paint-order: stroke; stroke: rgba(255,245,220,.8); stroke-width: 2px; }
  #map .realm { font-family: Cinzel, Georgia, serif; font-weight: 700; fill: rgba(22,13,4,.34); text-anchor: middle; letter-spacing: 3px; text-transform: uppercase; }
  #map .army { cursor: pointer; }
  #map .army .n { font-size: 9px; font-weight: bold; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.75); stroke-width: 2.2px; }
  #map .fl { font: 700 11px Cinzel, Georgia, serif; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.8); stroke-width: 3px; }
  #log, #hint, #tip { position: absolute; background: rgba(13,20,36,.92); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 12px; pointer-events: none; z-index: 1; }
  #legend { position: absolute; left: 10px; top: 10px; background: rgba(13,20,36,.88); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; font-size: 11px; line-height: 2; pointer-events: none; z-index: 1; }
  #legend svg.ui { width: 18px; height: 18px; padding: 2px; margin-right: 6px; }
  #log { right: 10px; bottom: 10px; width: 340px; } #log div { padding: 1px 0; }
  #hint { left: 10px; bottom: 10px; }
  #tip { display: none; width: 195px; border-color: var(--gold); z-index: 5; }
  #modal { position: fixed; inset: 0; background: rgba(5,8,16,.78); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal .box { width: min(500px, 90vw); background: linear-gradient(#1f2d52, #141e3a); border: 2px solid var(--gold); border-radius: 6px; padding: 24px 28px; font-size: 14px; line-height: 1.55; box-shadow: 0 10px 50px #000; animation: pop .25s ease-out; }
  @keyframes pop { from { transform: scale(.92); opacity: 0; } }
  #modal h2 { margin: 0 0 12px; font: 700 22px Cinzel, Georgia, serif; color: var(--gold2); letter-spacing: 2px; }
  #modal .btn { margin: 18px 6px 0 0; padding: 7px 16px; font-size: 14px; }
</style>
</head>
<body>
<div id="top"></div>
<div id="main">
  <aside id="side"></aside>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="legend"></div><div id="hint"></div><div id="tip"></div>
    <div id="log"></div>
  </div>
</div>
<div id="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><div id="mbtn"></div></div></div>
<script src="sim.js?v=9"></script>
<script src="ui.js?v=9"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashur Ascendant</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #10182b; color: #eadfc4; font: 13px/1.4 Georgia, 'Times New Roman', serif; overflow: hidden; }
  #top { height: 44px; display: flex; align-items: center; gap: 18px; padding: 0 14px; background: #17233f; border-bottom: 2px solid #c9962e; white-space: nowrap; }
  #top h1 { font-size: 17px; margin: 0; color: #e6b84a; letter-spacing: 2px; text-transform: uppercase; }
  #top .sp { flex: 1; }
  .btn { display: inline-block; padding: 3px 9px; border: 1px solid #c9962e; border-radius: 3px; background: #23345c; color: #f1e5c6; cursor: pointer; user-select: none; }
  .btn:hover { background: #30467a; }
  .btn.on { background: #c9962e; color: #17233f; font-weight: bold; }
  .btn.off { opacity: .4; cursor: default; }
  #main { display: flex; height: calc(100% - 44px); }
  #side { width: 290px; flex: none; overflow-y: auto; padding: 10px 12px 30px; background: #141e36; border-right: 1px solid #2c3d66; }
  #side h3 { margin: 14px 0 6px; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: #e6b84a; border-bottom: 1px solid #2c3d66; padding-bottom: 3px; }
  #side h3:first-child { margin-top: 0; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 6px; padding: 3px 0; }
  .muted { color: #9aa3b8; font-size: 12px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .good { color: #8fd68a; } .bad { color: #f0907f; }
  #mapwrap { flex: 1; position: relative; min-width: 0; }
  #map { width: 100%; height: 100%; display: block; background: #2b4f73; }
  #map polygon.land { stroke: #4a3a22; stroke-width: 1; cursor: pointer; }
  #map polygon.sel { stroke: #fff; stroke-width: 2.5; }
  #map text { font-family: Georgia, serif; pointer-events: none; }
  #map .lbl { font-size: 8.5px; fill: #1d150a; text-anchor: middle; paint-order: stroke; stroke: rgba(255,245,220,.75); stroke-width: 2px; }
  #map .army { cursor: pointer; }
  #map .army text { font-size: 8.5px; font-weight: bold; fill: #fff; text-anchor: middle; paint-order: stroke; stroke: rgba(0,0,0,.7); stroke-width: 2px; }
  #log { position: absolute; right: 8px; bottom: 8px; width: 330px; background: rgba(16,24,43,.88); border: 1px solid #2c3d66; border-radius: 4px; padding: 6px 9px; font-size: 12px; pointer-events: none; }
  #hint { position: absolute; left: 8px; bottom: 8px; background: rgba(16,24,43,.88); border: 1px solid #2c3d66; border-radius: 4px; padding: 5px 9px; font-size: 12px; pointer-events: none; }
  #modal { position: fixed; inset: 0; background: rgba(5,8,16,.7); display: none; align-items: center; justify-content: center; z-index: 10; }
  #modal .box { width: min(480px, 90vw); background: #17233f; border: 2px solid #c9962e; border-radius: 6px; padding: 20px 24px; font-size: 14px; }
  #modal h2 { margin: 0 0 10px; color: #e6b84a; letter-spacing: 1px; }
  #modal .btn { margin-top: 16px; padding: 6px 16px; }
</style>
</head>
<body>
<div id="top"></div>
<div id="main">
  <aside id="side"></aside>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="hint"></div>
    <div id="log"></div>
  </div>
</div>
<div id="modal"><div class="box"><h2 id="mt"></h2><div id="mb"></div><span class="btn" data-act="close">Continue</span></div></div>
<script src="sim.js"></script>
<script src="ui.js"></script>
</body>
</html>
